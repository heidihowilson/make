  # palette + linework), then the two most fragile character sheets.
  images: [the-cast/public/hero.png, cast/ake/sheet.png, cast/wilson/sheet.png]
prompt:
  style: prompts/style-block.txt
  tokens: from-registry
  staging: >
    The scene shop backstage, behind the theatre — the back side of the great
    curtain hangs at one edge, bare brick wall behind, a work light on a stand
    casting warm light. The company is building the set pieces for tonight.
    Seth kneels sawing a wooden theatrical flat on two sawhorses, sawdust
    flying; Wilson holds a tall finished flat upright with both metal arms,
    steadying it; Cadbury stands consulting a large unrolled blueprint, towel
    still on his forearm; Ake's wheeled fishbowl is parked up on the workbench
    among the tools, the goldfish supervising closely. Wood shavings, a crate
    stenciled "ACT I", scattered hand tools of the 1930s.
  camera: flat wide view of the workshop, held
  exclusions: prompts/exclusion-block.txt
notes: >
  Ake always renders with reference conditioning (the moustache and buck teeth
  are the first things a text-only prompt loses). His ochre is the only colour.
  Conditioning on the cast-site hero panel itself (all four characters in one
  image) held identity better than sheets alone across two 4-variant batches.
