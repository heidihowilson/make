# a workshop, because the toolkit is the scene shop, not the performance.
# Replaced the bow staging 2026-08-15 (Seth: backstage construction reads
# better for a component design library than a curtain call).
asset: docs-hero
output: 1376x768             # Gemini 16:9 1K native; shipped as q85 progressive JPEG
