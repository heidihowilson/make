# The docs-site hero: the whole company taking a bow at the footlights.
# The shipped reference render lives at reference/hero.png (from the-cast);
# this recipe exists to regenerate it at new sizes in the same staging.
asset: docs-hero
output: 1536x640            # hero frame crops to 320px tall on desktop; full scene shows at 740px
model: TBD                  # pin on first real run (ComfyUI checkpoint or Comfy Cloud model id)
seed: 1933
steps: 30
cfg: 4.5
reference:
  characters: [seth, wilson, cadbury, ake]
  weight: 0.75
prompt:
  style: prompts/style-block.txt
  tokens: from-registry
  staging: >
    The full company takes a bow at the footlights: Seth center stage mid-bow,
    Wilson the fence panel tipping his hat, Cadbury inclining precisely with
    ledger under one arm, Ake's wheeled fishbowl rolled to the front, water
    sloshing with alarm. Footlights below, curtain behind.
  camera: flat wide proscenium view, held
  exclusions: prompts/exclusion-block.txt
notes: >
  Ake always renders with reference conditioning (the moustache and buck teeth
  are the first things a text-only prompt loses). His ochre is the only colour.
history: []
